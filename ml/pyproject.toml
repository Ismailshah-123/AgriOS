[project]
name = "agrios-ml"
version = "0.1.0"
description = "AgriOS Crop Doctor training, evaluation and packaging pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision",
    "numpy>=2,<3",
    "pillow>=13.0.0,<14",
    "scikit-learn>=1.6,<2",
    "scikit-image>=0.25,<1",
    "matplotlib>=3.9,<4",
    "onnx>=1.23.2",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.8,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -rs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
